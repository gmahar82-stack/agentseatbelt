[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentseatbelt"
version = "0.1.0"
description = "A seatbelt for AI agents: budget caps, rate limits, time limits, loop detection and endpoint filters for any Python agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "gmahar82-stack" }]
keywords =["ai", "agents", "llm", "budget", "rate-limit", "safety", "openai", "anthropic", "groq"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/gmahar82-stack/agentseatbelt"
Issues = "https://github.com/gmahar82-stack/agentseatbelt/issues"
Changelog = "https://github.com/gmahar82-stack/agentseatbelt/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "httpx", "httpx2", "requests", "openai"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentseatbelt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
